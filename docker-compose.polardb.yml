# 企业内网生产环境的 PolarDB 存储覆盖层。
# 写入连接使用主节点；生产环境通过 REVGUARD_READ_DATABASE_URL 注入备节点读取/验证端点。
# 本地 Compose 可用同一服务地址演示连接契约，完整生命周期由 scripts/deploy_demo.sh 管理。
services:
  polardb-pg:
    image: polardb/polardb_pg_local_instance:15
    container_name: revguard-polardb
    environment:
      POLARDB_PORT: "5432"
      POLARDB_USER: "${REVGUARD_POLARDB_USER:-revguard_owner}"
      POLARDB_PASSWORD: "${REVGUARD_POLARDB_PASSWORD:?set REVGUARD_POLARDB_PASSWORD in .env}"
    volumes:
      - revguard-polardb-data:/var/polardb
    ports:
      - "127.0.0.1:15432:5432"
      - "127.0.0.1:15433:5433"
      - "127.0.0.1:15434:5434"
    healthcheck:
      # The vendor entrypoint temporarily starts PostgreSQL before creating
      # POLARDB_USER, then stops and restarts it. pg_isready alone is premature.
      test: ["CMD-SHELL", "pgrep -P 1 -f '^tail -f /dev/null$$' >/dev/null && PGPASSWORD=\"$$POLARDB_PASSWORD\" psql -h 127.0.0.1 -p 5432 -U \"$$POLARDB_USER\" -d postgres -v ON_ERROR_STOP=1 -tAc 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    shm_size: 512mb
    mem_limit: 4g
    cpus: 2.0
    restart: unless-stopped

  revguard-api:
    depends_on:
      polardb-pg:
        condition: service_healthy
    environment:
      REVGUARD_DATABASE_URL: "postgresql://${REVGUARD_POLARDB_USER:-revguard_owner}:${REVGUARD_POLARDB_PASSWORD}@polardb-pg:5432/revguard?sslmode=disable"
      # 生产环境设置为 PolarDB 备节点端点；留空时由应用回落到主连接，便于本地兼容演示。
      REVGUARD_READ_DATABASE_URL: "${REVGUARD_READ_DATABASE_URL:-}"
      REVGUARD_AUTO_MIGRATE: "false"
      # 仅限独立的合成录制库；生产环境必须保持 false。
      REVGUARD_ALLOW_DATABASE_RESET: "${REVGUARD_ALLOW_DATABASE_RESET:-false}"

volumes:
  revguard-polardb-data:
