# Persistent ERPNext v16 integration environment for RevGuard.
# Start with: docker compose --env-file .runtime/erpnext/erpnext.env \
#   -p revguard-erpnext -f docker-compose.erpnext.yml up -d
x-erpnext-image: &erpnext-image
  image: frappe/erpnext:v16.34.2
  restart: unless-stopped
  networks:
    - enterprise
  volumes:
    - erpnext-sites:/home/frappe/frappe-bench/sites
    - erpnext-logs:/home/frappe/frappe-bench/logs

services:
  erpnext-configurator:
    <<: *erpnext-image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host erpnext-db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://erpnext-redis-cache:6379;
        bench set-config -g redis_queue redis://erpnext-redis-queue:6379;
        bench set-config -g redis_socketio redis://erpnext-redis-queue:6379;
        bench set-config -gp socketio_port 9000;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell
    depends_on: {}

  erpnext-create-site:
    <<: *erpnext-image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 180 erpnext-db:3306;
        wait-for-it -t 180 erpnext-redis-cache:6379;
        wait-for-it -t 180 erpnext-redis-queue:6379;
        until test -s sites/common_site_config.json; do sleep 3; done;
        if test -d "sites/$${ERPNEXT_SITE_NAME}"; then
          echo "ERPNext site already exists";
        else
          bench new-site "$${ERPNEXT_SITE_NAME}" --mariadb-user-host-login-scope='%' --admin-password="$${ERPNEXT_ADMIN_PASSWORD}" --db-root-username=root --db-root-password="$${ERPNEXT_DB_ROOT_PASSWORD}" --install-app erpnext --set-default;
        fi
    environment:
      ERPNEXT_SITE_NAME: "${ERPNEXT_SITE_NAME:-revguard.local}"
      ERPNEXT_ADMIN_PASSWORD: "${ERPNEXT_ADMIN_PASSWORD:?set in private ERPNext env file}"
      ERPNEXT_DB_ROOT_PASSWORD: "${ERPNEXT_DB_ROOT_PASSWORD:?set in private ERPNext env file}"
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
      erpnext-db:
        condition: service_healthy

  erpnext-db:
    image: mariadb:11.8
    restart: unless-stopped
    networks:
      - enterprise
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: "${ERPNEXT_DB_ROOT_PASSWORD:?set in private ERPNext env file}"
      MARIADB_ROOT_PASSWORD: "${ERPNEXT_DB_ROOT_PASSWORD:?set in private ERPNext env file}"
    volumes:
      - erpnext-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 2g

  erpnext-redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks:
      - enterprise
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    mem_limit: 256m

  erpnext-redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks:
      - enterprise
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - erpnext-redis-queue-data:/data
    mem_limit: 256m

  erpnext-backend:
    <<: *erpnext-image
    environment:
      DB_HOST: erpnext-db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: "${ERPNEXT_DB_ROOT_PASSWORD:?set in private ERPNext env file}"
      MARIADB_ROOT_PASSWORD: "${ERPNEXT_DB_ROOT_PASSWORD:?set in private ERPNext env file}"
      GUNICORN_THREADS: "4"
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "120"
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
      erpnext-create-site:
        condition: service_completed_successfully
    mem_limit: 2g

  erpnext-frontend:
    <<: *erpnext-image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      FRAPPE_SITE_NAME_HEADER: "${ERPNEXT_SITE_NAME:-revguard.local}"
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "${ERPNEXT_BIND_ADDRESS:-127.0.0.1}:${ERPNEXT_PORT:-18080}:8080"
    depends_on:
      - erpnext-backend
      - erpnext-websocket
    mem_limit: 256m

  erpnext-websocket:
    <<: *erpnext-image
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      FRAPPE_REDIS_CACHE: redis://erpnext-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://erpnext-redis-queue:6379
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    mem_limit: 256m

  erpnext-worker-short:
    <<: *erpnext-image
    command: ["bench", "worker", "--queue", "short,default"]
    environment:
      FRAPPE_REDIS_CACHE: redis://erpnext-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://erpnext-redis-queue:6379
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    mem_limit: 512m

  erpnext-worker-long:
    <<: *erpnext-image
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment:
      FRAPPE_REDIS_CACHE: redis://erpnext-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://erpnext-redis-queue:6379
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    mem_limit: 512m

  erpnext-scheduler:
    <<: *erpnext-image
    command: ["bench", "schedule"]
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    mem_limit: 384m

volumes:
  erpnext-db-data:
  erpnext-redis-queue-data:
  erpnext-sites:
  erpnext-logs:

networks:
  enterprise:
    name: revguard-enterprise
    driver: bridge
