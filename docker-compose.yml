# RevGuard 本地编排：API 服务 + 演示数据持久化
# 与 AgentTeams 同机部署时，把 revguard-api 接入 AgentTeams 的 docker 网络即可
services:
  revguard-api:
    build: .
    container_name: revguard-api
    ports:
      - "19000:9000"   # 宿主 19000 → 容器 9000（避开 VM 上已占用的 9000）
    volumes:
      - revguard-outputs:/app/data/outputs   # Trace / 案例记忆沉淀
      - revguard-reports:/app/docs/reports   # 审计报告沉淀
      - revguard-db:/app/runtime             # SQLite 案件库（与 fixtures 目录隔离）
    environment:
      REVGUARD_APPROVAL_MODE: wait           # 服务端默认人工审批（演示真实人工节点）
      REVGUARD_FINANCE_FAIL_TIMES: "1"       # 财务接口故障注入，演示重试
      REVGUARD_VERIFICATION_TAMPER_AMOUNT: "${REVGUARD_VERIFICATION_TAMPER_AMOUNT:-0}" # 故障演练：仅偏移 Verifier 首次读取，不污染真实台账
      REVGUARD_APPROVAL_SIGNING_KEY: "${REVGUARD_APPROVAL_SIGNING_KEY:-revguard-demo-signing-key-change-before-production-2026}"
      REVGUARD_API_KEYS_JSON: "${REVGUARD_API_KEYS_JSON:-}"
      REVGUARD_ALLOW_INSECURE_DEMO_KEYS: "${REVGUARD_ALLOW_INSECURE_DEMO_KEYS:-true}" # 本地默认可一键运行；正式环境在 .env 中设为 false
      REVGUARD_ENABLE_LEGACY_TOOL_API: "${REVGUARD_ENABLE_LEGACY_TOOL_API:-false}" # 新版 Worker 只暴露 Skill；旧证据复放时显式开启
      REVGUARD_ENABLE_RECORDING_UI: "${REVGUARD_ENABLE_RECORDING_UI:-true}" # 复赛录制环境挂载 /demo 驾驶舱
      REVGUARD_RESET_ON_START: "${REVGUARD_RESET_ON_START:-false}"
      REVGUARD_DATABASE_URL: "${REVGUARD_DATABASE_URL:-}"
      REVGUARD_READ_DATABASE_URL: "${REVGUARD_READ_DATABASE_URL:-}"
      REVGUARD_DB_POOL_MIN: "${REVGUARD_DB_POOL_MIN:-1}"
      REVGUARD_DB_POOL_MAX: "${REVGUARD_DB_POOL_MAX:-10}"
      REVGUARD_AUTO_MIGRATE: "${REVGUARD_AUTO_MIGRATE:-false}"
      REVGUARD_RELEASE_VERSION: "${REVGUARD_RELEASE_VERSION:-0.4.0}"
      REVGUARD_TEAM_TRANSPORT: "${REVGUARD_TEAM_TRANSPORT:-mcp}" # 录制服务器设为 matrix；本地默认保留 MCP reference harness
      REVGUARD_MATRIX_HOMESERVER_URL: "${REVGUARD_MATRIX_HOMESERVER_URL:-http://agentteams-controller:6167}"
      REVGUARD_MATRIX_ROOM_ID: "${REVGUARD_MATRIX_ROOM_ID:-}"
      REVGUARD_MATRIX_WORKER_ROOMS_JSON: '${REVGUARD_MATRIX_WORKER_ROOMS_JSON:-{}}'
      REVGUARD_MATRIX_SERVER_NAME: "${REVGUARD_MATRIX_SERVER_NAME:-matrix-local.agentteams.io:8086}"
      REVGUARD_MATRIX_USERNAME: "${REVGUARD_MATRIX_USERNAME:-}"
      REVGUARD_MATRIX_PASSWORD: "${REVGUARD_MATRIX_PASSWORD:-}"
      REVGUARD_MATRIX_ACCESS_TOKEN: "${REVGUARD_MATRIX_ACCESS_TOKEN:-}"
      REVGUARD_HITL_MATRIX_HOMESERVER_URL: "${REVGUARD_HITL_MATRIX_HOMESERVER_URL:-http://agentteams-controller:6167}"
      REVGUARD_HITL_MATRIX_USERS_JSON: '${REVGUARD_HITL_MATRIX_USERS_JSON:-{}}'
      REVGUARD_HITL_ASSERTION_TTL_SECONDS: "${REVGUARD_HITL_ASSERTION_TTL_SECONDS:-120}"
      REVGUARD_HITL_MAX_AUTH_AGE_SECONDS: "${REVGUARD_HITL_MAX_AUTH_AGE_SECONDS:-300}"
      REVGUARD_MATRIX_STAGE_TIMEOUT_SECONDS: "${REVGUARD_MATRIX_STAGE_TIMEOUT_SECONDS:-240}"
      REVGUARD_MATRIX_RESPONSE_TIMEOUT_SECONDS: "${REVGUARD_MATRIX_RESPONSE_TIMEOUT_SECONDS:-90}"
      REVGUARD_MATRIX_ORCHESTRATOR_TIMEOUT_SECONDS: "${REVGUARD_MATRIX_ORCHESTRATOR_TIMEOUT_SECONDS:-120}"
      REVGUARD_MATRIX_REQUIRE_ORCHESTRATOR_ACK: "${REVGUARD_MATRIX_REQUIRE_ORCHESTRATOR_ACK:-true}"
      REVGUARD_TEAM_RUN_STALE_AFTER_SECONDS: "${REVGUARD_TEAM_RUN_STALE_AFTER_SECONDS:-600}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

volumes:
  revguard-outputs:
  revguard-reports:
  revguard-db:
