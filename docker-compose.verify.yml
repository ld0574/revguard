# Only disposable verification resources; no production network, ports or volumes.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: revguard_test
      POSTGRES_USER: revguard_test
      POSTGRES_PASSWORD: isolated-verification-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revguard_test -d revguard_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  checks:
    build:
      context: .
      dockerfile: Dockerfile.verify
    environment:
      REVGUARD_TEST_POSTGRES_DSN: postgresql://revguard_test:isolated-verification-only@postgres:5432/revguard_test
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
    depends_on:
      postgres:
        condition: service_healthy
  ui:
    build:
      context: .
      target: demo-ui-build
    command: ["sh", "-c", "npm run test:ui && npm run test:sites && npm audit --omit=dev --audit-level=high"]
