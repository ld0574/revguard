[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "revguard-agent-infra"
version = "0.3.0"
description = "Auditable multi-agent commission dispute resolution on AgentTeams"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "RevGuard Team"}]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "coverage==7.15.2",
  "ruff==0.15.22",
  "pip-audit==2.10.1",
  "bandit==1.9.4",
]

[tool.setuptools.packages.find]
include = ["revguard*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE", "RUF012", "RUF100", "DTZ", "EXE"]
