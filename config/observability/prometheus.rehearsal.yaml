# 决赛演示覆盖配置：Prometheus 抓 19088 演示栈（revguard-api-dev）指标。
#
# 用途：决赛现场 Demo 跑在演示栈上，而 ERPNext 调用、资金操作状态、PostgreSQL 复制
# 延迟与模型用量这些面板指标只有演示栈（0.6.0 构建）才产出。常驻栈 19000 仍保留
# 自己的 `/api/v1/ops/metrics/prometheus`，两条数据源互不影响。
#
# 启用方式（只影响 observability 项目，不动应用数据）：
#   echo 'REVGUARD_PROMETHEUS_CONFIG=./config/observability/prometheus.rehearsal.yaml' >> .env
#   docker compose -f docker-compose.yml -f docker-compose.agentteams.yml \
#     -f docker-compose.polardb.yml -f docker-compose.enterprise.yml \
#     -f docker-compose.observability.yml -p revguard up -d --no-deps --no-build prometheus
# 回滚：删除 .env 中的该行或改回 ./config/observability/prometheus.yaml 后重启 prometheus。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: revguard
    metrics_path: /api/v1/ops/metrics/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: [revguard-api-dev:9000]
  - job_name: readiness
    metrics_path: /probe
    params:
      module: [http_ready]
    static_configs:
      - targets: [http://revguard-api-dev:9000/api/v1/health/ready]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
