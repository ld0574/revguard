groups:
  - name: revguard
    rules:
      - alert: RevGuardUnavailable
        expr: up{job="revguard"} == 0 or probe_success{job="readiness"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: RevGuard API或业务数据库不可用
          description: 停止相关资金写入；恢复后先对账，禁止直接重发资金请求。
      - alert: RevGuardObserverMissing
        expr: absent(up{job="revguard"}) or absent(probe_success{job="readiness"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 观测数据缺失，不能判定为健康
      - alert: RevGuardMoneyRecoveryRequired
        expr: revguard_money_unresolved_operations > 0 or revguard_money_frozen_channels > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: 资金操作需要对账恢复
      - alert: RevGuardAuditChainBroken
        expr: revguard_audit_chain_valid < 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: 审计链校验失败
      - alert: RevGuardCollectorUnavailable
        expr: up{job="otel-collector"} == 0 or absent(up{job="otel-collector"})
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Trace采集器不可用或数据缺失
      - alert: RevGuardTraceQueuePressure
        expr: otelcol_exporter_queue_size / otelcol_exporter_queue_capacity > 0.8 or rate(otelcol_exporter_enqueue_failed_spans_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Trace导出队列接近上限或正在丢弃数据
      - alert: RevGuardHttpLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(revguard_http_request_duration_seconds_bucket{route!~".*(approval|run|resume).*"}[5m]))) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: RevGuard交互接口P95时延超过5秒
