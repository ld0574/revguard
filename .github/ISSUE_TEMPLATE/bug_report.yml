name: Bug report
description: Report a reproducible RevGuard defect without secrets or customer data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security issues, use private vulnerability reporting instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: Trigger and observed behavior
      description: Include the smallest reproducible sequence and sanitized evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Environment and checks
      description: Docker image, database mode and relevant test names. Do not paste credentials.
