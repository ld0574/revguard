name: Feature request
description: Propose a bounded, testable improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Concrete problem
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior and evidence
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security, money and data-provenance boundaries
