<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevGuard · 运行回放驾驶舱</title>
<meta name="description" content="RevGuard 真实运行记录的静态回放驾驶舱：确定性计算、真人审批、受限执行、独立复核与冲销恢复。">
<meta property="og:title" content="RevGuard · 运行回放驾驶舱">
<meta property="og:description" content="与 WebUI 一致的治理驾驶舱视图，逐步回放真实运行记录；页面只读取静态数据，不连接后端。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ld0574.github.io/revguard/replay.html">
<meta property="og:site_name" content="RevGuard">
<meta property="og:image" content="https://ld0574.github.io/revguard/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="RevGuard · 运行回放驾驶舱">
<meta name="twitter:description" content="确定性金额内核 + 真人审批门禁 + 执行/验证分离 + 未知结果恢复，基于真实运行记录的静态回放。">
<meta name="twitter:image" content="https://ld0574.github.io/revguard/og-image.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23040b14'/%3E%3Cpath d='M9 22V10h8.5a4 4 0 0 1 0 8H12l7 4' stroke='%231fb6ff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/replay.css">
</head>
<body>
<div class="app-shell" id="app-shell">
  <header class="topbar" id="topbar"></header>
  <div class="capture-notice" id="capture-notice" hidden></div>

  <main>
    <section class="summary-strip" id="summary-strip" aria-label="案件摘要"></section>

    <section class="pipeline-panel" aria-label="治理流水线">
      <div class="pipeline-stages" id="pipeline-stages"></div>
      <div class="pipeline-details" id="pipeline-details"></div>
      <div class="replay-controls" aria-label="回放控制">
        <div class="control-group">
          <button id="btn-play" class="primary-action" type="button" aria-pressed="false">播放回放</button>
          <button id="btn-prev" type="button">上一步</button>
          <button id="btn-next" class="evidence-action" type="button">下一步</button>
          <button id="btn-reset" class="text-action" type="button">回到开头</button>
        </div>
        <div class="control-meta">
          <label class="speed">速度
            <select id="speed" aria-label="回放速度">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select>
          </label>
          <span class="counter"><b id="step-index">1</b>/<span id="step-total">1</span> 步</span>
        </div>
      </div>
      <div class="progress" role="progressbar" aria-label="回放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p class="replay-step-note" id="replay-step-note"></p>
    </section>

    <div class="workspace">
      <section class="content-area">
        <nav class="tabs" id="tabs" aria-label="回放视图">
          <button data-tab="decision" class="active" type="button"><span class="tab-icon">◈</span>决策依据</button>
          <button data-tab="audit" type="button"><span class="tab-icon">↯</span>执行与审计</button>
          <button data-tab="permissions" type="button"><span class="tab-icon">⌁</span>权限边界</button>
          <button data-tab="value" type="button"><span class="tab-icon">◒</span>价值模拟</button>
          <button data-tab="public-data" type="button"><span class="tab-icon">◎</span>真实数据实验</button>
          <button data-tab="engineering" type="button"><span class="tab-icon">▣</span>工程证据</button>
          <button data-tab="observability" type="button"><span class="tab-icon">⌁</span>可观测大屏</button>
        </nav>
        <div id="tab-content" aria-live="polite"></div>
      </section>
      <aside class="safety-rail" id="safety-rail" aria-label="回放安全边界"></aside>
    </div>
  </main>

  <footer class="site-footer">
    <div><b>RevGuard</b> · GOAI Agent Infra 决赛项目</div>
    <div class="footer-links">
      <a href="./">项目首页</a>
      <a href="https://github.com/ld0574/revguard/releases/tag/v0.6.0">v0.6.0 Release</a>
      <a href="https://github.com/ld0574/revguard">源码仓库</a>
    </div>
    <div class="replay-footer-note">本页只读取 <code>website/data/</code> 中的脱敏运行记录；业务样本为合成数据，回放不会再次调用模型、ERPNext、PolarDB、Grafana 或任何后端接口。</div>
  </footer>
</div>
<script src="assets/replay.js"></script>
</body>
</html>
