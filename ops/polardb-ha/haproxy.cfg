global
  log stdout format raw local0

defaults
  mode tcp
  timeout connect 3s
  timeout client 30s
  timeout server 30s

frontend revguard_polar_stable_endpoint
  bind *:5432
  default_backend revguard_polar_nodes

backend revguard_polar_nodes
  option tcp-check
  server primary polardb-primary:5432 check inter 1s fall 2 rise 1
  server standby polardb-standby:5432 check backup inter 1s fall 2 rise 1
